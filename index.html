    return window.INITIAL_COURSES_DATA.concat(appState.customCourses || []);

  function findCourse(courseId) {
    return getAllCourses().find(c => c.id === courseId) || null;
  }

  function findChapter(courseId, chapterId) {
    const c = findCourse(courseId);
    if (!c) return null;
    return c.chapters.find(ch => ch.id === chapterId) || null;
  }

  function findQuestionById(qId) {
    const courses = getAllCourses();
    for (const c of courses) {
      for (const ch of c.chapters) {
        for (const q of ch.questions) {
          if (q.id === qId) {
            return { question: q, course: c, chapter: ch };
          }
        }
      }
    }
    return null;
  }

  function getCourseStats(course) {
    const totalChapters = course.chapters.length;
    let completedStudyCount = 0;
    let completedExamCount = 0;
    let totalQuestions = 0;

    course.chapters.forEach(ch => {
      if (appState.completedChapters[ch.id]) completedStudyCount++;
      if (appState.chapterExamBest[ch.id]) completedExamCount++;
      totalQuestions += ch.questions.length;
    });

    const studyPct = totalChapters > 0 ? Math.round((completedStudyCount / totalChapters) * 100) : 0;
    const examPct = totalChapters > 0 ? Math.round((completedExamCount / totalChapters) * 100) : 0;
    const overallPct = Math.round((studyPct + examPct) / 2);

    return {
      totalChapters,
      completedStudyCount,
      completedExamCount,
      totalQuestions,
      studyPct,
      examPct,
      overallPct
    };
  }

  function shuffleArray(arr) {
    const copy = arr.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const temp = copy[i];
      copy[i] = copy[j];
      copy[j] = temp;
    }
    return copy;
  }

  function prepareExamQuestions(rawQuestions, shouldShuffle, maxCount) {
    let list = rawQuestions.map(q => {
      const optionObjects = q.options.map((optText, idx) => ({
        text: optText,
        isCorrect: idx === q.correctIndex
      }));
      const finalOptions = shouldShuffle ? shuffleArray(optionObjects) : optionObjects;
      const newCorrectIndex = finalOptions.findIndex(o => o.isCorrect);
      return {
        id: q.id,
        difficulty: q.difficulty || 'متوسط',
        question: q.question,
        options: finalOptions.map(o => o.text),
        correctIndex: newCorrectIndex,
        explanation: q.explanation,
        courseId: q.courseId,
        chapterId: q.chapterId,
        chapterTitle: q.chapterTitle
      };
    });
    if (shouldShuffle) {
      list = shuffleArray(list);
    }
    if (maxCount && list.length > maxCount) {
      list = list.slice(0, maxCount);
    }
    return list;
  }

  function startExam(config) {
    const questions = prepareExamQuestions(config.rawQuestions, !!config.shuffle, config.maxCount || null);
    if (!questions.length) {
      showToast('لا توجد أسئلة متاحة لهذا الاختبار حالياً.', 'error');
      return;
    }
    appState.showQuestionMap = false;
    appState.activeExam = {
      title: config.title,
      mode: config.mode,
      courseId: config.courseId || null,
      chapterId: config.chapterId || null,
      rawQuestions: config.rawQuestions,
      maxCount: config.maxCount || null,
      questions: questions,
      currentIndex: 0,
      answers: {},
      finished: false
    };
    if (config.mode === 'chapter' && config.courseId && config.chapterId) {
      appState.currentView = 'chapter';
      appState.activeCourseId = config.courseId;
      appState.activeChapterId = config.chapterId;
      appState.activeChapterTab = 'exam';

              <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-4 shadow-2xs space-y-3">
                <div class="flex items-center justify-between">
                  <span class="text-[11px] font-extrabold text-slate-400">سؤال #${qIdx + 1}</span>
                  <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${diffBadge}">${q.difficulty}</span>
                </div>
                <h4 class="font-bold text-xs sm:text-sm text-slate-900 dark:text-white leading-relaxed">${q.question}</h4>
                <div class="space-y-2">
                  ${q.options.map((opt, oIdx) => {
                    let btnStyle = 'border-slate-200 dark:border-slate-700 bg-slate-50/70 dark:bg-slate-900/40';
                    if (isAnswered) {
                      if (oIdx === q.correctIndex) {
                        btnStyle = 'border-emerald-500 bg-emerald-50 dark:bg-emerald-950/60 text-emerald-900 dark:text-emerald-200 font-bold';
                      } else if (oIdx === selectedIdx) {
                        btnStyle = 'border-rose-500 bg-rose-50 dark:bg-rose-950/60 text-rose-900 dark:text-rose-200 font-bold';
                      } else {
                        btnStyle = 'border-slate-200 dark:border-slate-700 opacity-55';
                      }
                    }
                    return `
                      <button data-practice-answer="${q.id}|${oIdx}|${course.id}|${chapter.id}" class="w-full text-right p-3 rounded-xl border ${btnStyle} text-xs flex items-center justify-between gap-2 transition-all active:scale-[0.99]">
                        <span class="flex items-center gap-2">
                          <span class="w-6 h-6 rounded-lg bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 flex items-center justify-center font-extrabold text-[11px] shrink-0">${ARABIC_LETTERS[oIdx]}</span>
                          <span class="leading-relaxed">${opt}</span>
                        </span>
                        ${isAnswered && oIdx === q.correctIndex ? '<span>✅</span>' : ''}
                        ${isAnswered && oIdx === selectedIdx && oIdx !== q.correctIndex ? '<span>❌</span>' : ''}
                      </button>
                    `;
                  }).join('')}
                </div>
                ${isAnswered ? `
                  <div class="p-3 rounded-xl ${isCorrect ? 'bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 text-emerald-900 dark:text-emerald-200' : 'bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800 text-rose-900 dark:text-rose-200'} text-xs space-y-1 animate-fade-in">
                    <div class="font-extrabold">${isCorrect ? '🎉 إجابة صحيحة!' : `❌ خاطئة — الصحيح (${ARABIC_LETTERS[q.correctIndex]})`}</div>
                    <p class="leading-relaxed">${q.explanation}</p>
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;
    } else if (appState.activeChapterTab === 'exam') {
      tabContentHTML = renderExamWidgetHTML();
    } else if (appState.activeChapterTab === 'errors') {
      tabContentHTML = renderErrorsListHTML(chErrors, `أخطائي في ${chapter.title}`);
    }

    return `
      <div class="space-y-3.5 animate-fade-in">
        <!-- Compact Chapter Top Navigation -->
        <div class="flex items-center justify-between gap-1.5">
          <button data-nav-course="${course.id}" class="px-2.5 py-1.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-[11px] font-bold flex items-center gap-1">
            <span>→</span>
            <span>فصول ${course.code}</span>
          </button>
          <div class="flex items-center gap-1.5">
            ${prevChapter ? `<button data-nav-chapter="${course.id}|${prevChapter.id}" class="px-2.5 py-1.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-[11px] font-bold">السابق</button>` : ''}
            ${nextChapter ? `<button data-nav-chapter="${course.id}|${nextChapter.id}" class="px-2.5 py-1.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-[11px] font-bold">التالي ←</button>` : ''}
          </div>
        </div>

        <!-- Chapter Title & 2x3 Mobile Grid Tabs -->
        <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 p-4 shadow-xs space-y-3">
          <div class="flex items-start justify-between gap-2">
            <div>
              <span class="px-2 py-0.5 rounded-md bg-teal-50 dark:bg-teal-950 text-teal-700 dark:text-teal-300 text-[10px] font-extrabold">${course.code} • ${chapter.number} (${chapter.pagesRange})</span>
              <h2 class="text-base sm:text-lg font-extrabold text-slate-900 dark:text-white mt-1 leading-snug">${chapter.title}</h2>
            </div>
            <button data-toggle-complete="${chapter.id}" class="px-2.5 py-1 rounded-xl text-[11px] font-extrabold shrink-0 ${isStudied ? 'bg-emerald-100 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-300 border border-emerald-400' : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300'}">
              ${isStudied ? '✓ مكتمل' : 'تحديد كمكتمل'}
            </button>
          </div>

          <!-- 2x3 Grid of Chapter Tabs (Zero horizontal scroll on phone!) -->
          <div class="grid grid-cols-3 gap-1.5 pt-2 border-t border-slate-100 dark:border-slate-700">
            ${tabs.map(t => {
              const active = appState.activeChapterTab === t.id;
              return `
                <button data-switch-tab="${t.id}" type="button" class="py-2 px-1.5 rounded-xl text-[11px] font-extrabold flex flex-col items-center justify-center gap-0.5 transition-all ${active ? 'bg-teal-600 text-white shadow-xs' : 'bg-slate-100/90 dark:bg-slate-700/60 text-slate-600 dark:text-slate-300 hover:bg-slate-200/70'}">
                  <span class="text-sm leading-none">${t.icon}</span>
                  <span class="truncate max-w-full">${t.label}</span>
                </button>
              `;
            }).join('')}
          </div>
        </div>

        <!-- Active Tab Content -->
        <div>${tabContentHTML}</div>
      </div>
    `;
  }

  function renderStandaloneExamHTML() {
    if (!appState.activeExam) return renderHomeHTML();
    return `
      <div class="space-y-3.5 animate-fade-in">
        <div class="flex items-center justify-between">
          <button data-nav="home" class="px-3 py-1.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-bold">
            → إنهاء والعودة للرئيسية
          </button>
          <span class="text-[11px] font-bold text-teal-600 dark:text-teal-400">نظام الامتحانات التفاعلي</span>
        </div>
        ${renderExamWidgetHTML()}
      </div>
    `;
  }

  function renderExamWidgetHTML() {
    const ex = appState.activeExam;
    if (!ex || !ex.questions || !ex.questions.length) {
      return `<div class="p-6 bg-white dark:bg-slate-800 rounded-2xl text-center text-xs">لا يوجد اختبار نشط حالياً.</div>`;
    }

    const total = ex.questions.length;
    const answeredKeys = Object.keys(ex.answers);
    let correctCount = 0;
    let wrongCount = 0;
    answeredKeys.forEach(k => {
      const idx = Number(k);
      const ans = ex.answers[idx];
      if (ans === ex.questions[idx].correctIndex) correctCount++;
      else wrongCount++;
    });

    if (ex.finished) {
      const pct = Math.round((correctCount / total) * 100);
      const gradeColor = pct >= 80 ? 'text-emerald-600 dark:text-emerald-400' : (pct >= 50 ? 'text-amber-600 dark:text-amber-400' : 'text-rose-600 dark:text-rose-400');

      return `
        <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 p-5 shadow-sm space-y-5 animate-fade-in text-center">
          <div class="space-y-1">
            <div class="text-4xl">${pct >= 80 ? '🏆' : (pct >= 50 ? '👍' : '💪')}</div>
            <h3 class="text-xl font-extrabold text-slate-900 dark:text-white">نتيجة الامتحان النهائية</h3>
            <p class="text-xs text-slate-500 font-semibold">${ex.title}</p>
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <div class="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-900/60">
              <div class="text-[11px] text-slate-500">النسبة المئوية</div>
              <div class="text-2xl font-extrabold ${gradeColor} mt-0.5">${pct}%</div>
            </div>
            <div class="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-900/60">
              <div class="text-[11px] text-slate-500">المجموع</div>
              <div class="text-2xl font-extrabold text-slate-900 dark:text-white mt-0.5">${correctCount} / ${total}</div>
            </div>
            <div class="p-3 rounded-2xl bg-emerald-50 dark:bg-emerald-950/40">
              <div class="text-[11px] text-emerald-700 dark:text-emerald-300">إجابات صحيحة ✅</div>
              <div class="text-lg font-extrabold text-emerald-600">${correctCount}</div>
            </div>
            <div class="p-3 rounded-2xl bg-rose-50 dark:bg-rose-950/40">
              <div class="text-[11px] text-rose-700 dark:text-rose-300">إجابات خاطئة ❌</div>
              <div class="text-lg font-extrabold text-rose-600">${wrongCount}</div>
            </div>
          </div>

          <div class="space-y-2 pt-1">
            <button id="btn-exam-retake-shuffle" type="button" class="w-full py-3 px-4 rounded-2xl bg-teal-600 hover:bg-teal-500 text-white font-extrabold text-xs sm:text-sm shadow-sm flex items-center justify-center gap-2">
              <span>🔀</span>
              <span>إعادة الامتحان بترتيب مختلف للأسئلة والخيارات</span>
            </button>
            <button id="btn-exam-review-questions" type="button" class="w-full py-2.5 px-4 rounded-2xl bg-slate-100 dark:bg-slate-700 text-slate-800 dark:text-slate-100 font-bold text-xs">
              مراجعة إجاباتي في الامتحان
            </button>
            ${wrongCount > 0 ? `
              <button data-nav="all-errors" type="button" class="w-full py-2.5 px-4 rounded-2xl bg-rose-50 dark:bg-rose-950 text-rose-700 dark:text-rose-300 border border-rose-200 dark:border-rose-800 font-bold text-xs">
                ⚠️ عرض أخطائي مع التفسير العلمي
              </button>
            ` : ''}
          </div>
        </div>
      `;
    }

    const qIdx = ex.currentIndex;
    const q = ex.questions[qIdx];
    const selectedOpt = ex.answers[qIdx];
    const isAnswered = selectedOpt !== undefined;
    const isCorrect = isAnswered && selectedOpt === q.correctIndex;
    const progressPct = Math.round(((qIdx + 1) / total) * 100);
    const diffBadge = q.difficulty === 'سهل'
      ? 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300'
      : (q.difficulty === 'صعب' ? 'bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-300' : 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300');

    return `
      <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 p-4 sm:p-5 shadow-xs space-y-4">
        <!-- Mobile Exam Header & Progress Bar -->
        <div class="space-y-2 border-b border-slate-100 dark:border-slate-700 pb-3">
          <div class="flex items-center justify-between gap-2">
            <span class="text-xs font-extrabold text-teal-700 dark:text-teal-300 truncate">${ex.title}</span>
            <button id="btn-exam-retake-shuffle" type="button" class="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-700 text-[11px] font-bold shrink-0">
              🔀 خلط وإعادة
            </button>
          </div>

          <!-- Score & Map Toggle Row -->
          <div class="flex items-center justify-between text-xs">
            <span class="font-extrabold text-slate-900 dark:text-white">السؤال ${qIdx + 1} من ${total}</span>
            <div class="flex items-center gap-2 font-bold text-[11px]">
              <span class="text-emerald-600">✅ ${correctCount}</span>
              <span class="text-rose-600">❌ ${wrongCount}</span>
              <button id="btn-toggle-qmap" type="button" class="px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200">
                🔢 خريطة الأسئلة
              </button>
            </div>
          </div>

          <div class="w-full bg-slate-200 dark:bg-slate-700 h-1.5 rounded-full overflow-hidden">
            <div class="bg-teal-600 h-full rounded-full transition-all duration-200" style="width: ${progressPct}%"></div>
          </div>

          <!-- Collapsible Question Map Grid -->
          ${appState.showQuestionMap ? `
            <div class="pt-2 grid grid-cols-8 sm:grid-cols-10 gap-1.5 animate-fade-in">
              ${ex.questions.map((_, idx) => {
                const ans = ex.answers[idx];
                let pillClass = 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300';
                if (idx === qIdx) {
                  pillClass = 'ring-2 ring-teal-500 bg-teal-600 text-white font-extrabold';
                } else if (ans !== undefined) {
                  pillClass = ans === ex.questions[idx].correctIndex
                    ? 'bg-emerald-500 text-white font-bold'
                    : 'bg-rose-500 text-white font-bold';
                }
                return `
                  <button data-exam-jump="${idx}" class="h-7 rounded-lg text-[11px] flex items-center justify-center ${pillClass}">
                    ${idx + 1}
                  </button>
                `;
              }).join('')}
            </div>
          ` : ''}
        </div>

        <!-- Question Text & Options -->
        <div class="space-y-3">
          <div class="flex items-center justify-between">
            <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${diffBadge}">المستوى: ${q.difficulty}</span>
            <span class="text-[11px] text-slate-400">${isAnswered ? 'تم التصحيح الفوري' : 'اختر إجابة للتحقق'}</span>
          </div>

          <h4 class="text-sm sm:text-base font-extrabold text-slate-900 dark:text-white leading-relaxed">${q.question}</h4>

          <div class="space-y-2">
            ${q.options.map((optText, oIdx) => {
              let optStyle = 'border-slate-200 dark:border-slate-700 bg-slate-50/70 dark:bg-slate-900/40';
              if (isAnswered) {
                if (oIdx === q.correctIndex) {
                  optStyle = 'border-emerald-500 bg-emerald-50 dark:bg-emerald-950/60 text-emerald-900 dark:text-emerald-200 font-bold ring-1 ring-emerald-500';
                } else if (oIdx === selectedOpt) {
                  optStyle = 'border-rose-500 bg-rose-50 dark:bg-rose-950/60 text-rose-900 dark:text-rose-200 font-bold ring-1 ring-rose-500';
                } else {
                  optStyle = 'border-slate-200 dark:border-slate-700 opacity-55';
                }
              }
              return `
                <button data-exam-select="${oIdx}" class="w-full text-right p-3.5 rounded-2xl border ${optStyle} text-xs sm:text-sm flex items-center justify-between gap-2.5 transition-all active:scale-[0.99]">
                  <span class="flex items-center gap-2.5">
                    <span class="w-7 h-7 rounded-xl bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 flex items-center justify-center font-extrabold text-xs shrink-0">${ARABIC_LETTERS[oIdx]}</span>
                    <span class="leading-relaxed">${optText}</span>
                  </span>
                  ${isAnswered && oIdx === q.correctIndex ? '<span class="text-sm shrink-0">✅</span>' : ''}
                  ${isAnswered && oIdx === selectedOpt && oIdx !== q.correctIndex ? '<span class="text-sm shrink-0">❌</span>' : ''}
                </button>
              `;
            }).join('')}
          </div>

          <!-- Immediate Correction Feedback -->
          ${isAnswered ? `
            <div class="p-3.5 rounded-2xl ${isCorrect ? 'bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-300 dark:border-emerald-800 text-emerald-950 dark:text-emerald-100' : 'bg-rose-50 dark:bg-rose-950/50 border border-rose-300 dark:border-rose-800 text-rose-950 dark:text-rose-100'} space-y-1.5 animate-fade-in">
              <div class="font-extrabold text-xs sm:text-sm">
                ${isCorrect ? '✅ إجابة صحيحة! أحسنت.' : `❌ إجابة خاطئة — الصحيح (${ARABIC_LETTERS[q.correctIndex]}): ${q.options[q.correctIndex]}`}
              </div>
              <p class="text-xs leading-relaxed">
                <span class="font-bold">💡 التفسير:</span> ${q.explanation}
              </p>
            </div>
          ` : ''}
        </div>

        <!-- Thumb-Friendly Bottom Exam Controls -->
        <div class="pt-3 border-t border-slate-200 dark:border-slate-700 grid grid-cols-3 gap-2">
          <button id="btn-exam-prev" type="button" ${qIdx === 0 ? 'disabled' : ''} class="py-2.5 px-3 rounded-xl border border-slate-300 dark:border-slate-600 text-xs font-bold disabled:opacity-40 text-center">
            → السابق
          </button>

          ${qIdx < total - 1 ? `
            <button id="btn-exam-next" type="button" class="py-2.5 px-3 rounded-xl ${isAnswered ? 'bg-teal-600 text-white shadow-xs' : 'bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200'} text-xs font-extrabold text-center">
              التالي ←
            </button>
          ` : `
            <div></div>
          `}

          <button id="btn-exam-finish" type="button" class="py-2.5 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-extrabold text-center">
            إنهاء 🏆
          </button>
        </div>
      </div>
    `;
  }

  function renderAllErrorsHTML() {
    const allErrors = Object.values(appState.wrongQuestions || {});
    return `
      <div class="space-y-3.5 animate-fade-in">
        <div class="flex items-center justify-between gap-2">
          <button data-nav="home" class="px-3 py-1.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-bold">
            → الرئيسية
          </button>
          ${allErrors.length > 0 ? `
            <div class="flex items-center gap-1.5">
              <button id="btn-retry-all-errors" type="button" class="px-3 py-1.5 rounded-xl bg-teal-600 text-white text-xs font-bold">
                ⚡ اختبرني في أخطائي (${allErrors.length})
              </button>
              <button id="btn-clear-all-errors" type="button" class="px-2.5 py-1.5 rounded-xl bg-rose-50 dark:bg-rose-950 text-rose-700 dark:text-rose-300 text-xs font-bold">
                مسح
              </button>
            </div>
          ` : ''}
        </div>
        ${renderErrorsListHTML(allErrors, 'بنك مراجعة الأخطاء الشامل')}
      </div>
    `;
  }

  function renderErrorsListHTML(errorItems, headingTitle) {
    if (!errorItems || !errorItems.length) {
      return `
        <div class="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 p-6 text-center space-y-2">
          <div class="text-3xl">🎉</div>
          <h3 class="text-sm sm:text-base font-extrabold text-slate-900 dark:text-white">${headingTitle}</h3>
          <p class="text-xs text-slate-500 dark:text-slate-400 leading-relaxed">
            لا توجد أي أخطاء مسجلة هنا! أي سؤال تخطئ فيه أثناء التدريب أو الامتحانات سيظهر هنا مع الإجابة الصحيحة وشرحها.
          </p>
        </div>
      `;
    }

    return `
      <div class="space-y-3">
        <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-3.5">
          <h3 class="text-sm font-extrabold text-slate-900 dark:text-white">⚠️ ${headingTitle} (${errorItems.length})</h3>
        </div>

        ${errorItems.map(err => {
          const found = findQuestionById(err.questionId);
          if (!found) return '';
          const { question: q, course: c, chapter: ch } = found;
          return `
            <div class="bg-white dark:bg-slate-800 rounded-2xl border border-rose-200 dark:border-rose-900/70 p-4 shadow-2xs space-y-2.5">
              <div class="flex items-center justify-between gap-2">
                <span class="px-2 py-0.5 rounded-md bg-slate-100 dark:bg-slate-700 text-[10px] font-bold text-slate-700 dark:text-slate-300 truncate">
                  ${c.code} • ${ch.number}: ${ch.title}
                </span>
                <button data-remove-error="${q.id}" class="text-[11px] text-emerald-600 dark:text-emerald-400 font-extrabold shrink-0">
                  ✓ أتقنته (إزالة)
                </button>
              </div>
              <h4 class="font-bold text-xs sm:text-sm text-slate-900 dark:text-white leading-relaxed">${q.question}</h4>
              <div class="space-y-1.5 text-xs">
                <div class="p-2.5 rounded-xl bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-800 text-rose-900 dark:text-rose-200">
                  <span class="font-bold">❌ إجابتك الخاطئة: </span>${err.selectedOptionText}
                </div>
                <div class="p-2.5 rounded-xl bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-200 dark:border-emerald-800 text-emerald-900 dark:text-emerald-200">
                  <span class="font-bold">✅ الإجابة الصحيحة: </span>${q.options[q.correctIndex]}
                </div>
              </div>
              <div class="p-3 rounded-xl bg-slate-50 dark:bg-slate-900/60 text-xs text-slate-700 dark:text-slate-200 leading-relaxed">
                <span class="font-bold text-teal-700 dark:text-teal-400">💡 التفسير:</span> ${q.explanation}
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }

  function openModal(title, bodyHTML) {
    const overlay = document.getElementById('modal-overlay');
    const titleEl = document.getElementById('modal-title');
    const bodyEl = document.getElementById('modal-body');
    if (!overlay || !titleEl || !bodyEl) return;
    titleEl.textContent = title;
    bodyEl.innerHTML = bodyHTML;
    overlay.classList.remove('hidden');
    overlay.classList.add('flex');
  }

  function closeModal() {
    const overlay = document.getElementById('modal-overlay');
    if (!overlay) return;
    overlay.classList.add('hidden');
    overlay.classList.remove('flex');
  }

  function openComprehensiveExamModal() {
    const courses = getAllCourses();
    const html = `
      <div class="space-y-3">
        <p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
          اختر المادة لبدء امتحان شامل بترتيب عشوائي للأسئلة والخيارات (أ، ب، ج، د):
        </p>

  function handleGlobalSearch(query) {
    const dropdown = document.getElementById('search-results-dropdown');
    const clearBtn = document.getElementById('btn-clear-search');
    if (!dropdown) return;

    const q = (query || '').trim().toLowerCase();
    if (!q) {
      dropdown.classList.add('hidden');
      if (clearBtn) clearBtn.classList.add('hidden');
      return;
    }
    if (clearBtn) clearBtn.classList.remove('hidden');

    const results = [];
    const courses = getAllCourses();
    courses.forEach(course => {
      course.chapters.forEach(ch => {
        if (ch.title.toLowerCase().includes(q) || ch.englishTitle.toLowerCase().includes(q) || ch.overview.toLowerCase().includes(q)) {
          results.push({
            type: 'فصل',
            title: `${ch.number}: ${ch.title}`,
            sub: course.title,
            courseId: course.id,
            chapterId: ch.id,
            tab: 'explanation'
          });
        }
        ch.terms.forEach(t => {
          if (t.en.toLowerCase().includes(q) || t.ar.toLowerCase().includes(q) || t.def.toLowerCase().includes(q)) {
            results.push({
              type: 'مصطلح',
              title: `${t.ar} (${t.en})`,
              sub: `${course.code} • ${ch.title}`,
              courseId: course.id,
              chapterId: ch.id,
              tab: 'terms'
            });
          }
        });
        ch.sections.forEach(sec => {
          const matchedText = sec.content.find(p => p.toLowerCase().includes(q));
          if (sec.heading.toLowerCase().includes(q) || matchedText) {
            results.push({
              type: 'شرح',
              title: sec.heading,
              sub: `${course.code} • ${ch.title}`,
              courseId: course.id,
              chapterId: ch.id,
              tab: 'explanation'
            });
          }
        });
      });
    });

    if (!results.length) {
      dropdown.innerHTML = `<div class="p-3 text-center text-xs text-slate-500">لا توجد نتائج مطابقة لـ "${query}"</div>`;
    } else {
      dropdown.innerHTML = results.slice(0, 10).map(r => `
        <button data-search-hit="${r.courseId}|${r.chapterId}|${r.tab}" class="w-full text-right p-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-700/70 flex items-center justify-between gap-2">
          <div class="min-w-0">
            <div class="font-bold text-xs text-slate-900 dark:text-white truncate">${r.title}</div>
            <div class="text-[10px] text-slate-500 dark:text-slate-400 truncate">${r.sub}</div>
          </div>
          <span class="px-2 py-0.5 rounded-md bg-teal-50 dark:bg-teal-950 text-teal-700 dark:text-teal-300 text-[10px] font-bold shrink-0">${r.type}</span>
        </button>
      `).join('');
    }
    dropdown.classList.remove('hidden');
  }

  function setupEventListeners() {
    document.addEventListener('click', function(e) {
      const target = e.target;

      const searchDropdown = document.getElementById('search-results-dropdown');
      const searchInput = document.getElementById('global-search-input');
      if (searchDropdown && !searchDropdown.contains(target) && target !== searchInput) {
        searchDropdown.classList.add('hidden');
      }

      // Focus search button
      if (target.closest('#btn-toggle-search-bar')) {
        if (searchInput) searchInput.focus();
        return;
      }

      // Toggle Mobile / Wide frame
      if (target.closest('#btn-layout-width')) {
        appState.wideLayout = !appState.wideLayout;
        applyLayoutWidth();
        saveState();
        showToast(appState.wideLayout ? 'تم التبديل إلى العرض العريض 🖥️' : 'تم التبديل إلى عرض الهاتف المنظم 📱', 'info');
        return;
      }

      // Brand / Home
      if (target.closest('#btn-brand-home') || target.closest('[data-nav="home"]')) {
        appState.currentView = 'home';
        closeMobileSidebar();
        renderAll();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      // Bottom Nav Course shortcut
      const bnavCourseBtn = target.closest('[data-bnav-course]');
      if (bnavCourseBtn) {
        const cId = bnavCourseBtn.getAttribute('data-bnav-course');
        appState.currentView = 'course';
        appState.activeCourseId = cId;
        closeMobileSidebar();
        renderAll();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      // Bottom Nav Exam
      if (target.closest('#bnav-exam')) {
        openComprehensiveExamModal();
        return;
      }

      // Home Course Filter Tabs
      const filterCourseBtn = target.closest('[data-filter-course]');
      if (filterCourseBtn) {
        appState.homeCourseFilter = filterCourseBtn.getAttribute('data-filter-course');
        renderMainView();
        return;
      }

      // Toggle Accordion Section in Chapter Explanation
      const toggleSecBtn = target.closest('[data-toggle-sec]');
      if (toggleSecBtn) {
        const key = toggleSecBtn.getAttribute('data-toggle-sec');
        const current = appState.openSections[key] !== undefined ? appState.openSections[key] : true;
        appState.openSections[key] = !current;
        renderMainView();
        return;
      }

      // Expand / Collapse all sections
      if (target.closest('#btn-expand-all-sec')) {
        const ch = findChapter(appState.activeCourseId, appState.activeChapterId);
        if (ch) {
          ch.sections.forEach((_, idx) => { appState.openSections[`${ch.id}_sec_${idx}`] = true; });
          renderMainView();
        }
        return;
      }
      if (target.closest('#btn-collapse-all-sec')) {
        const ch = findChapter(appState.activeCourseId, appState.activeChapterId);
        if (ch) {
          ch.sections.forEach((_, idx) => { appState.openSections[`${ch.id}_sec_${idx}`] = false; });
          renderMainView();
        }
        return;
      }

      // Toggle Question Map in Exam
      if (target.closest('#btn-toggle-qmap')) {
        appState.showQuestionMap = !appState.showQuestionMap;
        renderMainView();
        return;
      }

      // All Errors view
      if (target.closest('#btn-header-errors') || target.closest('[data-nav="all-errors"]')) {
        appState.currentView = 'all-errors';
        closeMobileSidebar();
        renderAll();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      // File Manifest Modal
      if (target.closest('#btn-header-index')) {
        openIndexManifestModal();
        return;
      }

      // Add Content / Backup Modal
      if (target.closest('#btn-header-add-content')) {
        openContentManagerModal();
        return;
      }

      // Theme Toggle
      if (target.closest('#btn-theme-toggle')) {
        toggleTheme();
        return;
      }

      // Mobile menu open/close
      if (target.closest('#btn-mobile-menu')) {
        openMobileSidebar();
        return;
      }
      if (target.closest('#btn-close-sidebar') || target.id === 'sidebar-backdrop') {
        closeMobileSidebar();
        return;
      }

      // Modal close
      if (target.closest('#btn-close-modal') || target.id === 'modal-overlay') {
        closeModal();
        return;
      }

      // Hero Continue Study
      if (target.closest('#btn-hero-continue')) {
        const courses = getAllCourses();
        let cId = courses[0].id;
        let chId = courses[0].chapters[0].id;
        let tab = 'explanation';
        if (appState.lastVisited && findChapter(appState.lastVisited.courseId, appState.lastVisited.chapterId)) {
          cId = appState.lastVisited.courseId;
          chId = appState.lastVisited.chapterId;
          tab = appState.lastVisited.tab || 'explanation';
        }
        appState.currentView = 'chapter';
        appState.activeCourseId = cId;
        appState.activeChapterId = chId;
        appState.activeChapterTab = tab;
        renderAll();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      // Hero Comprehensive Exam
      if (target.closest('#btn-hero-comp-exam')) {
        openComprehensiveExamModal();
        return;
      }

      // Navigate to Course
      const navCourseBtn = target.closest('[data-nav-course]');
      if (navCourseBtn) {
        const cId = navCourseBtn.getAttribute('data-nav-course');
        appState.currentView = 'course';
        appState.activeCourseId = cId;
        closeMobileSidebar();
        renderAll();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      // Navigate to Chapter
      const navChapterBtn = target.closest('[data-nav-chapter]');
      if (navChapterBtn) {
        const parts = navChapterBtn.getAttribute('data-nav-chapter').split('|');
        const cId = parts[0];
        const chId = parts[1];
        const tab = parts[2] || 'explanation';
        appState.currentView = 'chapter';
        appState.activeCourseId = cId;
        appState.activeChapterId = chId;
        appState.activeChapterTab = tab;
        appState.lastVisited = { courseId: cId, chapterId: chId, tab: tab, timestamp: Date.now() };
        saveState();
        closeMobileSidebar();
        renderAll();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      // Search hit click
      const searchHitBtn = target.closest('[data-search-hit]');
      if (searchHitBtn) {
        const [cId, chId, tab] = searchHitBtn.getAttribute('data-search-hit').split('|');
        appState.currentView = 'chapter';
        appState.activeCourseId = cId;
        appState.activeChapterId = chId;
        appState.activeChapterTab = tab || 'explanation';
        appState.lastVisited = { courseId: cId, chapterId: chId, tab: appState.activeChapterTab, timestamp: Date.now() };
        saveState();
        if (searchDropdown) searchDropdown.classList.add('hidden');
        renderAll();
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      // Switch Chapter Tab
      const switchTabBtn = target.closest('[data-switch-tab]');
      if (switchTabBtn) {
        const tabId = switchTabBtn.getAttribute('data-switch-tab');
        appState.activeChapterTab = tabId;
        if (appState.activeCourseId && appState.activeChapterId) {
          appState.lastVisited = { courseId: appState.activeCourseId, chapterId: appState.activeChapterId, tab: tabId, timestamp: Date.now() };
          saveState();
        }
        renderAll();
        return;
      }

      // Toggle Chapter Complete
      const toggleCompBtn = target.closest('[data-toggle-complete]');
      if (toggleCompBtn) {
        e.stopPropagation();
        const chId = toggleCompBtn.getAttribute('data-toggle-complete');
        if (appState.completedChapters[chId]) {
          delete appState.completedChapters[chId];
          showToast('تم إلغاء علامة إكمال الفصل', 'info');
        } else {
          appState.completedChapters[chId] = true;
          showToast('أحسنت! تم تسجيل الفصل كمكتمل ✓', 'success');
        }
        saveState();
        renderAll();
        return;
      }

      // Practice Question Answer
      const practiceBtn = target.closest('[data-practice-answer]');
      if (practiceBtn) {
        const [qId, oIdxStr, cId, chId] = practiceBtn.getAttribute('data-practice-answer').split('|');
        const oIdx = Number(oIdxStr);
        appState.practiceState[qId] = oIdx;
        const found = findQuestionById(qId);
        if (found && oIdx !== found.question.correctIndex) {
          appState.wrongQuestions[qId] = {
            questionId: qId,
            courseId: cId,
            chapterId: chId,
            selectedOptionText: found.question.options[oIdx],
            correctOptionText: found.question.options[found.question.correctIndex],
            timestamp: Date.now()
          };
          saveState();
        }
        renderMainView();
        return;
      }

      // Reset Practice
      if (target.closest('#btn-reset-practice')) {
        const ch = findChapter(appState.activeCourseId, appState.activeChapterId);
        if (ch) {
          ch.questions.forEach(q => delete appState.practiceState[q.id]);
          showToast('تمت إعادة تعيين تدريب الفصل', 'info');
          renderMainView();
        }
        return;
      }

      // Start Course Exam
      const courseExamBtn = target.closest('[data-start-course-exam]') || target.closest('[data-modal-exam]');
      if (courseExamBtn) {
        const attr = courseExamBtn.getAttribute('data-start-course-exam') || courseExamBtn.getAttribute('data-modal-exam');
        const [cId, countStr] = attr.split('|');
        const maxCount = countStr === '30' ? 30 : null;
        closeModal();

        if (cId === 'ALL') {
          const allQ = [];
          getAllCourses().forEach(c => {
            c.chapters.forEach(ch => {
              ch.questions.forEach(q => {
                allQ.push(Object.assign({}, q, { courseId: c.id, chapterId: ch.id, chapterTitle: `${c.title} - ${ch.number}` }));
              });
            });
          });
          startExam({
            title: maxCount ? 'الامتحان الشامل لجميع المواد (30 سؤالاً)' : `الامتحان الشامل الكامل (${allQ.length} سؤالاً)`,
            mode: 'comprehensive',
            rawQuestions: allQ,
            shuffle: true,
            maxCount: maxCount
          });
        } else {
          const course = findCourse(cId);
          if (!course) return;
          const courseQ = [];
          course.chapters.forEach(ch => {
            ch.questions.forEach(q => {
              courseQ.push(Object.assign({}, q, { courseId: course.id, chapterId: ch.id, chapterTitle: `${ch.number}: ${ch.title}` }));
            });
          });
          startExam({
            title: `${course.title} — ${maxCount ? 'امتحان 30 سؤالاً' : `كل الأسئلة (${courseQ.length})`}`,
            mode: 'course',
            courseId: course.id,
            rawQuestions: courseQ,
            shuffle: true,
            maxCount: maxCount
          });
        }
        return;
      }

      // Start Course Errors Exam
      const courseErrBtn = target.closest('[data-start-course-errors]');
      if (courseErrBtn) {
        const cId = courseErrBtn.getAttribute('data-start-course-errors');
        const course = findCourse(cId);
        const errItems = Object.values(appState.wrongQuestions || {}).filter(w => w.courseId === cId);
        const rawQ = [];
        errItems.forEach(w => {
          const f = findQuestionById(w.questionId);
          if (f) rawQ.push(Object.assign({}, f.question, { courseId: f.course.id, chapterId: f.chapter.id, chapterTitle: f.chapter.title }));
        });
        startExam({
          title: `تصحيح أخطاء: ${course ? course.title : ''}`,
          mode: 'errors-retry',
          courseId: cId,
          rawQuestions: rawQ,
          shuffle: true
        });
        return;
      }

      // Retry All Errors Exam
      if (target.closest('#btn-retry-all-errors')) {
        const errItems = Object.values(appState.wrongQuestions || {});
        const rawQ = [];
        errItems.forEach(w => {
          const f = findQuestionById(w.questionId);
          if (f) rawQ.push(Object.assign({}, f.question, { courseId: f.course.id, chapterId: f.chapter.id, chapterTitle: f.chapter.title }));
        });
        startExam({
          title: 'اختبار تصحيح جميع الأخطاء المسجلة',
          mode: 'errors-retry',
          rawQuestions: rawQ,
          shuffle: true
        });
        return;
      }

      // Interactive Exam Option Select
      const examSelectBtn = target.closest('[data-exam-select]');
      if (examSelectBtn && appState.activeExam && !appState.activeExam.finished) {
        const ex = appState.activeExam;
        const qIdx = ex.currentIndex;
        if (ex.answers[qIdx] !== undefined) return;
        const chosenIdx = Number(examSelectBtn.getAttribute('data-exam-select'));
        ex.answers[qIdx] = chosenIdx;
        const currentQ = ex.questions[qIdx];

        if (chosenIdx !== currentQ.correctIndex) {
          appState.wrongQuestions[currentQ.id] = {
            questionId: currentQ.id,
            courseId: currentQ.courseId || appState.activeCourseId,
            chapterId: currentQ.chapterId || appState.activeChapterId,
            selectedOptionText: currentQ.options[chosenIdx],
            correctOptionText: currentQ.options[currentQ.correctIndex],
            timestamp: Date.now()
          };
          saveState();
        }
        renderMainView();
        return;
      }

      // Exam Jump
      const examJumpBtn = target.closest('[data-exam-jump]');
      if (examJumpBtn && appState.activeExam) {
        appState.activeExam.currentIndex = Number(examJumpBtn.getAttribute('data-exam-jump'));
        appState.showQuestionMap = false;
        renderMainView();
        return;
      }

      // Exam Prev / Next
      if (target.closest('#btn-exam-prev') && appState.activeExam) {
        if (appState.activeExam.currentIndex > 0) {
          appState.activeExam.currentIndex--;
          renderMainView();
        }
        return;
      }
      if (target.closest('#btn-exam-next') && appState.activeExam) {
        if (appState.activeExam.currentIndex < appState.activeExam.questions.length - 1) {
          appState.activeExam.currentIndex++;
          renderMainView();
        }
        return;
      }

      // Exam Finish
      if (target.closest('#btn-exam-finish') && appState.activeExam) {
        const ex = appState.activeExam;
        ex.finished = true;
        const total = ex.questions.length;
        let correctCount = 0;
        Object.keys(ex.answers).forEach(k => {
          const idx = Number(k);
          if (ex.answers[idx] === ex.questions[idx].correctIndex) correctCount++;
        });
        const pct = Math.round((correctCount / total) * 100);
        const nowStr = new Date().toLocaleDateString('ar-JO', { year: 'numeric', month: 'short', day: 'numeric' });

        appState.examHistory.push({
          id: 'ex-' + Date.now(),
          title: ex.title,
          score: correctCount,
          total: total,
          percentage: pct,
          date: nowStr
        });

        if (ex.mode === 'chapter' && ex.chapterId) {
          const prevBest = appState.chapterExamBest[ex.chapterId];
          if (!prevBest || pct >= prevBest.percentage) {
            appState.chapterExamBest[ex.chapterId] = {
              score: correctCount,
              total: total,
              percentage: pct,
              date: nowStr
            };
          }
        }
        saveState();
        renderAll();
        return;
      }

      // Exam Retake Shuffle
      if (target.closest('#btn-exam-retake-shuffle') && appState.activeExam) {
        const ex = appState.activeExam;
        ex.questions = prepareExamQuestions(ex.rawQuestions, true, ex.maxCount);
        ex.currentIndex = 0;
        ex.answers = {};
        ex.finished = false;
        showToast('تمت إعادة الامتحان بترتيب عشوائي جديد 🔀', 'info');
        renderMainView();
        return;
      }

      // Review Questions
      if (target.closest('#btn-exam-review-questions') && appState.activeExam) {
        appState.activeExam.finished = false;
        appState.activeExam.currentIndex = 0;
        renderMainView();
        return;
      }

      // Remove single error
      const removeErrBtn = target.closest('[data-remove-error]');
      if (removeErrBtn) {
        const qId = removeErrBtn.getAttribute('data-remove-error');
        delete appState.wrongQuestions[qId];
        saveState();
        showToast('تمت إزالة السؤال من الأخطاء ✓', 'success');
        renderAll();
        return;
      }

      // Clear all errors
      if (target.closest('#btn-clear-all-errors')) {
        appState.wrongQuestions = {};
        saveState();
        showToast('تم مسح سجل الأخطاء', 'info');
        renderAll();
        return;
      }

      // Clear exam history
      if (target.closest('#btn-clear-history')) {
        appState.examHistory = [];
        saveState();
        showToast('تم مسح سجل الاختبارات', 'info');
        renderAll();
        return;
      }

      // Clear search
      if (target.closest('#btn-clear-search')) {
        if (searchInput) searchInput.value = '';
        handleGlobalSearch('');
        return;
      }

      // Export JSON
      if (target.closest('#btn-export-json')) {
        const dataStr = JSON.stringify(appState, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'university_study_progress_backup.json';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
        showToast('تم تحميل النسخة الاحتياطية ✓', 'success');
        return;
      }
    });

    document.addEventListener('input', function(e) {
      if (e.target.id === 'global-search-input') {
        handleGlobalSearch(e.target.value);
      } else if (e.target.id === 'input-term-filter') {
        appState.termSearchQuery = e.target.value;
        renderMainView();
        const input = document.getElementById('input-term-filter');
        if (input) {
          input.focus();
          input.setSelectionRange(input.value.length, input.value.length);
        }
      }
    });

    document.addEventListener('change', function(e) {
      if (e.target.id === 'input-import-json' && e.target.files && e.target.files[0]) {
        const reader = new FileReader();
        reader.onload = function(ev) {
          try {
            const imported = JSON.parse(ev.target.result);
            appState = Object.assign({}, appState, imported);
            saveState();
            applyTheme();
            applyLayoutWidth();
            closeModal();
            renderAll();
            showToast('تم استيراد بيانات التقدم بنجاح ✓', 'success');
          } catch (err) {
            showToast('ملف غير صالح', 'error');
          }
        };
        reader.readAsText(e.target.files[0]);
      }
    });

    document.addEventListener('submit', function(e) {
      if (e.target.id === 'form-add-custom-chapter') {
        e.preventDefault();
        const courseSel = document.getElementById('custom-course-select').value;
        const chNum = document.getElementById('custom-ch-num').value.trim();
        const chTitle = document.getElementById('custom-ch-title').value.trim();
        const chContent = document.getElementById('custom-ch-content').value.trim().split('\n').filter(Boolean);
        const qText = document.getElementById('custom-q-text').value.trim();
        const opt0 = document.getElementById('custom-q-opt0').value.trim();
        const opt1 = document.getElementById('custom-q-opt1').value.trim();
        const opt2 = document.getElementById('custom-q-opt2').value.trim();
        const opt3 = document.getElementById('custom-q-opt3').value.trim();
        const qExp = document.getElementById('custom-q-exp').value.trim();

        const newChapter = {
          id: 'custom-ch-' + Date.now(),
          number: chNum,
          title: chTitle,
          englishTitle: chTitle,
          pagesRange: 'محتوى مضاف',
          overview: chContent[0] || chTitle,
          sections: [{ heading: chTitle, content: chContent }],
          summary: chContent,
          terms: [],
          questions: [{
            id: 'custom-q-' + Date.now(),
            difficulty: 'متوسط',
            question: qText,
            options: [opt0, opt1, opt2, opt3],
            correctIndex: 0,
            explanation: qExp
          }]
        };

        if (courseSel === '__new__') {
          const newCourseTitle = document.getElementById('custom-new-course-title').value.trim() || 'مادة مضافة';
          appState.customCourses.push({
            id: 'custom-course-' + Date.now(),
            code: 'NEW 101',
            title: newCourseTitle,
            englishTitle: newCourseTitle,
            institution: 'إضافة مخصصة',
            sourceFiles: ['إدخال مباشر'],
            color: 'emerald',
            icon: 'book',
            description: 'مادة دراسية مضافة بواسطة المستخدم.',
            chapters: [newChapter]
          });
        } else {
          const targetCourse = findCourse(courseSel);
          if (targetCourse) targetCourse.chapters.push(newChapter);
        }

        saveState();
        closeModal();
        renderAll();
        showToast('تمت إضافة الفصل بنجاح ✓', 'success');
      }
    });
  }

  function init() {
    loadState();
    setupEventListeners();
    renderAll();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();

  </script>
</body>
</html>
